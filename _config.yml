title: Meng Wang
name: Meng Wang
description: "I am a Postdoctoral Fellow at Nanyang Technological University (NTU),
  working with Prof. [Lihua Xie](https://scholar.google.com/citations?user=Fmrv3J8AAAAJ&hl=en).
  I received my Ph.D. from the School of Automation Science and Electrical Engineering,
  Beihang University, supervised by Prof. [Lei Guo](https://scholar.google.com/citations?user=IxO-SDwAAAAJ&hl=zh-CN),
  Prof. [Xiang Yu](https://scholar.google.com/citations?user=6UgtuZ8AAAAJ&hl=zh-CN&oi=ao),
  and Prof. [Kexin Guo](https://scholar.google.com/citations?hl=zh-CN&user=c0MaejIAAAAJ).
  I received my B.Eng. in Automation from Northwestern Polytechnical University (rank
  first) in 2020. My research interests include world model learning, learning-for-control, cooperative planning and dexterous operation of aerial manipulators."

